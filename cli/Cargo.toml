[package]
name = "logic-batteries"
version = "0.1.0"
edition = "2021"
description = "Install Logic Batteries — composable Prolog rule modules — into any SWI/Scryer project. Checksummed, removable, no server required."
license = "MIT"
repository = "https://github.com/datagrout/logic-batteries"
homepage = "https://github.com/datagrout/logic-batteries"
readme = "README.md"
keywords = ["prolog", "logic", "rules", "scryer", "swi-prolog"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "battery"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
